name: pie eval
run-name: pie eval ${{ github.event.client_payload.pie_commit || inputs.pie_commit }}
permissions: { contents: write, actions: read }
concurrency:
  group: pie-eval-${{ github.event.client_payload.pie_commit || github.event.inputs.pie_commit }}
  cancel-in-progress: true
on:
  repository_dispatch:
    types: [pie-eval]
  workflow_dispatch:
    inputs:
      pie_commit: { description: "pie commit", required: true }
      models: { description: "comma-separated model ids (empty: the default model)", required: false, default: "" }
      macs: { description: "comma-separated Mac ids (empty: every connected Mac)", required: false, default: "" }
      benchmarks: { description: "comma-separated workload ids (empty: every targeted benchmark)", required: false, default: "" }

env:
  PIE_REPO: ${{ vars.PIE_REPO || 'pie-project/pie' }}
  DEFAULT_MODELS: qwen3.5-0.8b-bf16

jobs:
  start:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.p.outputs.commit }}
      models: ${{ steps.p.outputs.models }}
      macs: ${{ steps.p.outputs.macs }}
      skip: ${{ steps.p.outputs.skip }}
      workloads: ${{ steps.p.outputs.workloads }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT || github.token }}
          COMMIT: ${{ github.event.client_payload.pie_commit || github.event.inputs.pie_commit }}
          IN_MODELS: ${{ github.event.inputs.models }}
          IN_MACS: ${{ github.event.inputs.macs }}
          IN_WORKLOADS: ${{ github.event.inputs.benchmarks }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pie_commit must be a full sha, got '$COMMIT'"; exit 1; }
          info=$(gh api "repos/$PIE_REPO/commits/$COMMIT" 2>/dev/null || echo '{}')
          author=$(jq -r '.author.login // empty' <<<"$info")
          line=$(jq -r '.commit.message // ""' <<<"$info" | grep -iE '^evals:' | tail -1 || true)
          models=""; macs=""; workloads=""; source="no setup"; skip=true
          if [ -n "$author" ] && [ -f "users/$author.json" ]; then
            f="users/$author.json"; source=$f
            models=$(jq -r '.models // [] | join(",")' "$f"); macs=$(jq -r '.machines // [] | join(",")' "$f"); workloads=$(jq -r '.benchmarks // [] | join(",")' "$f")
            [ -n "$models" ] && [ -n "$macs" ] && [ -n "$workloads" ] && skip=false
          fi
          if [ -n "$line" ]; then
            m=$(grep -oE 'models=[^ ]+' <<<"$line" | cut -d= -f2 || true); k=$(grep -oE 'macs=[^ ]+' <<<"$line" | cut -d= -f2 || true)
            [ -n "$m" ] && models=$m; [ -n "$k" ] && macs=$k; source="commit message"; skip=false
          fi
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            models=$IN_MODELS; macs=$IN_MACS; workloads=$IN_WORKLOADS; source=manual; skip=false
          fi
          [ -n "$models" ] || models=$DEFAULT_MODELS
          [[ "$models$macs$workloads" =~ ^[a-z0-9.,-]*$ ]] || { echo "::error::bad models '$models' or macs '$macs'"; exit 1; }
          echo "author=${author:-unknown} setup=$source models=$models macs=${macs:-every connected Mac} benchmarks=${workloads:-all} skip=$skip" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "commit=$COMMIT"; echo "models=$models"; echo "macs=$macs"; echo "workloads=$workloads"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

  run:
    needs: start
    if: needs.start.outputs.skip != 'true'
    uses: ./.github/workflows/tier.yml
    with:
      tier: targeted
      pie_commit: ${{ needs.start.outputs.commit }}
      artifacts: ${{ needs.start.outputs.models }}
      platforms: ${{ needs.start.outputs.macs }}
      workloads: ${{ needs.start.outputs.workloads }}
    secrets: inherit
