# Cheap end-to-end check of the RunPod path, before spending on a benchmark:
# validate GPU ids, launch ONE pod on the runpod-ci-runner image, have it
# register as an ephemeral runner, run the node preflight (no pie build),
# show the volume, tear it down.
# ~10 minutes of one GPU. Run this first after setting the org secret/vars.
name: runpod-check
on:
  workflow_dispatch:
    inputs:
      platform: { description: "platform id (a RunPod one)", required: true, default: "l40s-x1" }
      image: { description: "container image", required: false, default: "pieproject/runpod-ci-runner:latest" }
      pod_id: { description: "an already-running pod whose runner is registered (skips launch; teardown still terminates it)", required: false, default: "" }
jobs:
  launch:
    runs-on: ubuntu-latest
    outputs: { pod_id: "${{ inputs.pod_id || steps.pod.outputs.pod_id }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: GPU ids
        if: inputs.pod_id == ''
        run: .venv/bin/pie-evals runpod-gpus && .venv/bin/pie-evals validate-platforms
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }
      - name: launch pod (self-destructs in 20 min)
        if: inputs.pod_id == ''
        id: pod
        run: .venv/bin/pie-evals launch-pod --platform "${{ inputs.platform }}" --image "${{ inputs.image }}" --repo "${{ github.repository }}" --image-version check --kill-minutes 20
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
  probe:
    needs: launch
    if: always() && needs.launch.result != 'failure'
    runs-on: [self-hosted, linux, "${{ inputs.platform }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv .venv && .venv/bin/pip install -q -e "."
          .venv/bin/pie-evals-node preflight
          nvidia-smi
          echo "env from runner .env:"; env | grep -E "^(PIE_|HF_|CARGO_|RUSTUP_)" | sort
          echo "volume:"; df -h /workspace || true; ls -la /workspace || true
  teardown:
    needs: [launch, probe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - run: .venv/bin/pie-evals terminate-pod "${{ needs.launch.outputs.pod_id }}" || true
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }
