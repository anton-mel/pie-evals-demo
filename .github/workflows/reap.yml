name: reap-pods
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - run: .venv/bin/pie-evals reap-pods --max-age-hours 8
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }
