name: reap-pods
# Hourly: terminate pie-evals pods older than 2.5h whose runner is not busy
# (a pod working through its configuration's queue is spared until 30h). Every
# pod ends itself when idle and at its own hard timer; this is the last net.
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
jobs:
  reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - run: .venv/bin/pie-evals reap-pods --max-age-hours 2.5 --hard-max-age-hours 30 --repo "${{ github.repository }}"
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}", GH_TOKEN: "${{ secrets.GH_RUNNER_PAT || github.token }}" }
