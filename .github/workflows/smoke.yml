# Smoke tier: pie against its own history on small models + miniatures, many
# workload shapes, every inferlet on one representative shape. Runs per pie
# commit (repository_dispatch from the pie repo's CI, or manual).
name: smoke
# the called tier.yml's collect job commits to main; a called job may not
# request more than the caller grants (startup_failure otherwise)
permissions: { contents: write, actions: read }
concurrency:
  group: smoke-${{ github.event.inputs.pie_commit || github.event.client_payload.pie_commit }}
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      pie_commit: { description: "pie commit to test", required: true }
      platforms: { description: "comma-separated platform ids (default: all smoke platforms)", required: false, default: "" }
      build_platform: { description: "platform for the build/prepare pod", required: false, default: "" }
  repository_dispatch:
    types: [pie-commit]
jobs:
  run:
    uses: ./.github/workflows/tier.yml
    with:
      tier: smoke
      pie_commit: ${{ github.event.inputs.pie_commit || github.event.client_payload.pie_commit }}
      platforms: ${{ github.event.inputs.platforms || '' }}
      build_platform: ${{ github.event.inputs.build_platform || '' }}
    secrets: inherit
