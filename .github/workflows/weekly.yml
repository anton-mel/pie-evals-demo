name: weekly
# the called tier.yml's collect job commits to main; a called job may not
# request more than the caller grants (startup_failure otherwise)
permissions: { contents: write, actions: read }
on:
  # schedule disabled until the tier is calibrated: an unfiltered weekly launched 16 pods at once
  # (re-enable with a platforms/engines filter and max_jobs_per_platform)
  workflow_dispatch:
    inputs:
      pie_commit: { description: "pie commit (default: origin/main)", required: false, default: "" }
      platforms: { description: "comma-separated platform ids", required: false, default: "" }
      engines: { description: "comma-separated engine ids", required: false, default: "" }
      programs: { description: "comma-separated program ids", required: false, default: "" }
      max_jobs: { description: "cap on jobs", required: false, default: "" }
      build_platform: { description: "platform for the build/prepare pod", required: false, default: "" }
      max_jobs_per_platform: { description: "cap per platform", required: false, default: "" }
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs: { pie_commit: "${{ steps.c.outputs.commit }}" }
    steps:
      - id: c
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          C="${{ github.event.inputs.pie_commit }}"
          [ -z "$C" ] && C=$(git ls-remote https://github.com/pie-project/pie.git refs/heads/main | cut -f1)
          # a short SHA or a branch name cannot be shallow-fetched on the pod; resolve it to the full SHA here
          if ! [[ "$C" =~ ^[0-9a-f]{40}$ ]]; then C=$(gh api "repos/pie-project/pie/commits/$C" --jq .sha); fi
          echo "commit=$C" >> "$GITHUB_OUTPUT"
  run:
    needs: resolve
    uses: ./.github/workflows/tier.yml
    with:
      tier: weekly
      pie_commit: ${{ needs.resolve.outputs.pie_commit }}
      platforms: ${{ github.event.inputs.platforms || '' }}
      engines: ${{ github.event.inputs.engines || '' }}
      programs: ${{ github.event.inputs.programs || '' }}
      max_jobs: ${{ github.event.inputs.max_jobs || '' }}
      build_platform: ${{ github.event.inputs.build_platform || '' }}
      max_jobs_per_platform: ${{ github.event.inputs.max_jobs_per_platform || '' }}
    secrets: inherit
