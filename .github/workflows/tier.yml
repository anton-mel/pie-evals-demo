# Reusable tier body: expand → (launch RunPod pods as ephemeral runners) → bench on
# self-hosted runners (pods + resident Macs) → teardown → collect. Called by
# smoke.yml / nightly.yml / weekly.yml with the tier name and the pie commit.
name: tier
on:
  workflow_call:
    inputs:
      tier: { type: string, required: true }
      pie_commit: { type: string, required: true }
      platforms: { type: string, required: false, default: "" }

concurrency:
  group: ${{ inputs.tier }}-${{ inputs.pie_commit }}
  cancel-in-progress: false

env:
  PIE_COMMIT: ${{ inputs.pie_commit }}

jobs:
  expand:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.jobs.outputs.matrix }}
      kill_minutes: ${{ steps.jobs.outputs.kill_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: matrix check (budgets, shard counts)
        run: .venv/bin/pie-evals check
      - name: validate RunPod GPU type ids
        run: .venv/bin/pie-evals validate-platforms
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }
      - name: job specs
        id: jobs
        run: |
          PLAT_ARGS=""
          .venv/bin/pie-evals jobs --tier "${{ inputs.tier }}" --pie-commit "$PIE_COMMIT" --out jobs $PLAT_ARGS
          echo "matrix=$(cat jobs/gh-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: jobs, path: jobs/ }

  # RunPod platforms: launch a pod that registers itself as an ephemeral runner,
  # then a second job lands on it. Macs are resident runners and skip the launch.
  launch:
    needs: expand
    if: ${{ fromJson(needs.expand.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.expand.outputs.matrix) }}
    outputs:
      pods: ${{ steps.pod.outputs.pod_id }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.runpod
      - uses: astral-sh/setup-uv@v3
        if: matrix.runpod
      - run: uv venv && uv pip install -e ".[orchestrate]"
        if: matrix.runpod
      - name: runner registration token
        if: matrix.runpod
        id: token
        run: |
          TOKEN=$(gh api -X POST repos/${{ github.repository }}/actions/runners/registration-token --jq .token)
          echo "::add-mask::$TOKEN"; echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env: { GH_TOKEN: "${{ secrets.RUNNER_ADMIN_PAT }}" }
      - name: launch pod
        if: matrix.runpod
        id: pod
        run: .venv/bin/pie-evals launch-pod --platform "${{ matrix.platform }}" --image "${{ vars.RUNPOD_IMAGE }}" --repo "${{ github.repository }}" --image-version "${{ vars.RUNPOD_IMAGE_VERSION }}" --kill-minutes "${{ needs.expand.outputs.kill_minutes }}"
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_TOKEN: ${{ steps.token.outputs.token }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      - name: record pod id
        if: matrix.runpod
        run: echo "${{ steps.pod.outputs.pod_id }}" > "pod-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        if: matrix.runpod
        with: { name: "pod-${{ matrix.platform }}", path: "pod-${{ matrix.platform }}.txt" }

  bench:
    needs: [expand, launch]
    if: always() && fromJson(needs.expand.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.expand.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    # hard kill = job budget × kill_factor (policy in matrix/suites.yaml); the pod self-destructs at the same mark
    timeout-minutes: ${{ fromJson(needs.expand.outputs.kill_minutes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: jobs, path: jobs }
      - name: install harness
        run: |
          uv venv --python 3.12 .venv 2>/dev/null || python3 -m venv .venv
          .venv/bin/pip install -q -e "."
      - name: pie checkout (pinned commit)
        run: |
          PIE_ROOT="${PIE_ROOT:-$HOME/pie}"   # on RunPod the startup script sets PIE_ROOT=/workspace/pie (network volume)
          [ -d "$PIE_ROOT/.git" ] || git clone --quiet git@github.com:pie-project/pie.git "$PIE_ROOT"
          git -C "$PIE_ROOT" fetch --quiet origin
          git -C "$PIE_ROOT" checkout --quiet "$PIE_COMMIT"
          echo "PIE_ROOT=$PIE_ROOT" >> "$GITHUB_ENV"
      - name: run
        run: .venv/bin/pie-evals-node run --job "jobs/${{ matrix.job_id }}.json" --pie-root "$PIE_ROOT" --out "out/${{ matrix.job_id }}"
        env:
          PIE_EVALS_CACHE: ${{ runner.os == 'Linux' && '/workspace/pie-evals-cache' || '' }}
          HF_HUB_CACHE: ${{ runner.os == 'Linux' && '/workspace/hf' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.job_id }}", path: "out/${{ matrix.job_id }}", retention-days: 30 }

  teardown:
    needs: [expand, launch, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "pod-*", path: pods, merge-multiple: true }
      - name: terminate pods
        run: for f in pods/*.txt; do [ -f "$f" ] && .venv/bin/pie-evals terminate-pod "$(cat "$f")" || true; done
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }

  collect:
    needs: [expand, bench]
    if: always()
    uses: ./.github/workflows/collect.yml
    with: { tier: "${{ inputs.tier }}" }
    secrets: inherit
