# Reusable tier body: expand → (launch RunPod pods as ephemeral runners) → bench on
# self-hosted runners (pods + resident Macs) → teardown → collect. Called by
# smoke.yml / nightly.yml / weekly.yml with the tier name and the pie commit.
name: tier
on:
  workflow_call:
    inputs:
      tier: { type: string, required: true }
      pie_commit: { type: string, required: true }
      platforms: { type: string, required: false, default: "" }

jobs:
  expand:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.jobs.outputs.matrix }}
      kill_minutes: ${{ steps.jobs.outputs.kill_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: matrix check (budgets, shard counts)
        run: .venv/bin/pie-evals check
      - name: validate RunPod GPU type ids
        run: .venv/bin/pie-evals validate-platforms
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }
      - name: job specs
        id: jobs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PLAT_ARGS=""
          for p in $(echo "${{ inputs.platforms }}" | tr ',' ' '); do PLAT_ARGS="$PLAT_ARGS --platform $p"; done
          .venv/bin/pie-evals jobs --tier "${{ inputs.tier }}" --pie-commit "${{ inputs.pie_commit }}" --out jobs --skip-unavailable $PLAT_ARGS
          echo "matrix=$(cat jobs/gh-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: jobs, path: jobs/ }

  # Build once, on one pod, before the fan-out: the bench pods then restore
  # pie from $PIE_EVALS_CACHE/builds/<commit>-cuda on the network volume
  # instead of each building it.
  build-launch:
    needs: expand
    runs-on: ubuntu-latest
    outputs: { pod_id: "${{ steps.pod.outputs.pod_id }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - id: pod
        run: .venv/bin/pie-evals launch-pod --platform "${{ vars.RUNPOD_BUILD_PLATFORM || 'l40s-x1' }}" --repo "${{ github.repository }}" --image "${{ vars.RUNPOD_IMAGE || 'pieproject/runpod-ci-runner:latest' }}" --kill-minutes 60
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
  build:
    needs: build-launch
    runs-on: [self-hosted, linux, "${{ vars.RUNPOD_BUILD_PLATFORM || 'l40s-x1' }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e "."
      - name: build pie at the pinned commit and cache it on the volume
        run: .venv/bin/pie-evals-node build --pie-commit "${{ inputs.pie_commit }}" --features cuda --pie-root "$PIE_ROOT" --mirror "$PIE_MIRROR" --target-dir "$CARGO_TARGET_DIR"
      - name: checkpoints and miniatures onto the volume
        run: .venv/bin/pie-evals-node prepare --tier "${{ inputs.tier }}" --pie-root "$PIE_ROOT" || echo "::warning::some checkpoints could not be prepared (their cells will be load_fail)"
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
  build-teardown:
    needs: [build-launch, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - run: .venv/bin/pie-evals terminate-pod "${{ needs.build-launch.outputs.pod_id }}" || true
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }

  # RunPod platforms: launch a pod that registers itself as an ephemeral runner,
  # then a second job lands on it. Macs are resident runners and skip the launch.
  launch:
    needs: [expand, build]
    if: ${{ fromJson(needs.expand.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.expand.outputs.matrix) }}
    outputs:
      pods: ${{ steps.pod.outputs.pod_id }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.runpod
      - uses: astral-sh/setup-uv@v3
        if: matrix.runpod
      - run: uv venv && uv pip install -e ".[orchestrate]"
        if: matrix.runpod
      - name: launch pod
        if: matrix.runpod
        id: pod
        run: .venv/bin/pie-evals launch-pod --platform "${{ matrix.platform }}" --repo "${{ github.repository }}" --image "${{ vars.RUNPOD_IMAGE || 'pieproject/runpod-ci-runner:latest' }}" --kill-minutes "${{ needs.expand.outputs.kill_minutes }}"
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      - name: record pod id
        if: matrix.runpod
        run: echo "${{ steps.pod.outputs.pod_id }}" > "pod-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        if: matrix.runpod
        with: { name: "pod-${{ matrix.platform }}", path: "pod-${{ matrix.platform }}.txt" }

  bench:
    needs: [expand, launch]
    if: always() && fromJson(needs.expand.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.expand.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    # hard kill = job budget × kill_factor (policy in matrix/suites.yaml); the pod self-destructs at the same mark
    timeout-minutes: 90   # = job_budget_minutes x kill_factor in matrix/suites.yaml; the runner watchdog and pod self-destruct enforce the exact value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: jobs, path: jobs }
      - name: install harness
        run: |
          # uv venvs carry no pip: install through uv when it exists, plain venv+pip otherwise (Macs)
          if command -v uv >/dev/null; then uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e "."
          else python3 -m venv .venv && .venv/bin/pip install -q -e "."; fi
      - name: pie root
        run: |
          # RunPod: the startup script sets PIE_ROOT=/tmp/pie (pod-local) and PIE_MIRROR (bare mirror on the volume);
          # the node clones from the mirror and restores the cached build. Macs: a resident checkout under $HOME.
          echo "PIE_ROOT=${PIE_ROOT:-$HOME/pie}" >> "$GITHUB_ENV"
      - name: run
        run: .venv/bin/pie-evals-node run --job "jobs/${{ matrix.job_id }}.json" --pie-root "$PIE_ROOT" --out "out/${{ matrix.job_id }}"
        # on RunPod every cache path comes from the runner's .env (written by the startup script)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.job_id }}", path: "out/${{ matrix.job_id }}", retention-days: 30 }

  teardown:
    needs: [expand, launch, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "pod-*", path: pods, merge-multiple: true }
      - name: terminate pods
        run: for f in pods/*.txt; do [ -f "$f" ] && .venv/bin/pie-evals terminate-pod "$(cat "$f")" || true; done
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }

  # Bookkeeping. Inline rather than a nested `uses:` of collect.yml: the nested
  # form failed at startup because this job's `permissions` exceeded what the
  # caller granted (callers now grant contents: write); kept inline anyway.
  collect:
    needs: [expand, bench]
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: out }
      - name: import into store
        run: |
          shopt -s nullglob
          dirs=(out/out-*)
          if [ ${#dirs[@]} -gt 0 ]; then .venv/bin/pie-evals collect --tier "${{ inputs.tier }}" "${dirs[@]}"; else echo "::warning::no node outputs"; fi
      - name: reports
        id: report
        run: .venv/bin/pie-evals report --tier "${{ inputs.tier }}" --out reports
      - name: commit store + reports
        run: |
          git config user.name "pie-evals-bot"; git config user.email "pie-evals-bot@users.noreply.github.com"
          mkdir -p store/records reports
          git add -A -- store reports
          git diff --cached --quiet || git commit -m "store: ${{ inputs.tier }} run ${{ github.run_id }}"
          git pull --rebase --quiet origin main && git push --quiet origin HEAD:main
      - name: fail on regression
        if: steps.report.outputs.regressions != '0'
        run: echo "::error::${{ steps.report.outputs.regressions }} confirmed regressions — see reports/${{ inputs.tier }}/regressions.md"; exit 1
