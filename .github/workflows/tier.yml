# Reusable tier body: expand → (launch RunPod pods as ephemeral runners) → bench on
# self-hosted runners (pods + resident Macs) → teardown → collect. Called by
# smoke.yml / nightly.yml / weekly.yml with the tier name and the pie commit.
name: tier
on:
  workflow_call:
    inputs:
      tier: { type: string, required: true }
      pie_commit: { type: string, required: true }
      platforms: { type: string, required: false, default: "" }
      engines: { type: string, required: false, default: "" }
      programs: { type: string, required: false, default: "" }
      artifacts: { type: string, required: false, default: "" }
      max_jobs: { type: string, required: false, default: "" }
      max_jobs_per_platform: { type: string, required: false, default: "" }
      build_platform: { type: string, required: false, default: "" }
      persist: { type: boolean, required: false, default: true }
      skip_recorded: { type: boolean, required: false, default: false }
    outputs:
      platforms: { value: "${{ jobs.expand.outputs.platforms }}" }

jobs:
  expand:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.jobs.outputs.matrix }}
      kill_minutes: ${{ steps.jobs.outputs.kill_minutes }}
      needs_pods: ${{ steps.jobs.outputs.needs_pods }}
      platforms: ${{ steps.jobs.outputs.platforms }}
      bench_timeout_minutes: ${{ steps.jobs.outputs.bench_timeout_minutes }}
      pods: ${{ steps.jobs.outputs.pods }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: matrix check (budgets, shard counts)
        run: .venv/bin/pie-evals check
      - name: validate RunPod GPU type ids
        run: .venv/bin/pie-evals validate-platforms
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }
      - name: job specs
        id: jobs
        env: { GH_TOKEN: "${{ secrets.GH_RUNNER_PAT || github.token }}" }
        run: |
          PLAT_ARGS=""
          for p in $(echo "${{ inputs.platforms }}" | tr ',' ' '); do PLAT_ARGS="$PLAT_ARGS --platform $p"; done
          for e in $(echo "${{ inputs.engines }}" | tr ',' ' '); do PLAT_ARGS="$PLAT_ARGS --engine $e"; done
          for g in $(echo "${{ inputs.programs }}" | tr ',' ' '); do PLAT_ARGS="$PLAT_ARGS --program $g"; done
          for a in $(echo "${{ inputs.artifacts }}" | tr ',' ' '); do PLAT_ARGS="$PLAT_ARGS --artifact $a"; done
          [ -n "${{ inputs.max_jobs }}" ] && PLAT_ARGS="$PLAT_ARGS --max-jobs ${{ inputs.max_jobs }}"
          [ -n "${{ inputs.max_jobs_per_platform }}" ] && PLAT_ARGS="$PLAT_ARGS --max-jobs-per-platform ${{ inputs.max_jobs_per_platform }}"
          [ "${{ inputs.skip_recorded }}" = "true" ] && PLAT_ARGS="$PLAT_ARGS --skip-recorded"
          .venv/bin/pie-evals jobs --tier "${{ inputs.tier }}" --pie-commit "${{ inputs.pie_commit }}" --out jobs --skip-unavailable $PLAT_ARGS
          echo "matrix=$(cat jobs/gh-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "needs_pods=$(jq -r '[.include[] | select(.runpod)] | length > 0' jobs/gh-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -r '[.include[].platform] | unique | join(",")' jobs/gh-matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: jobs, path: jobs/ }

  # One pod per hardware configuration: its runner carries the labels of every
  # platform it hosts (an x1 rides its x2, one GPU masked), GitHub hands it the
  # shards one after another, and the first shard builds pie and fetches the
  # checkpoints for all that follow. The pod ends itself when its queue is empty.
  launch:
    needs: expand
    if: needs.expand.outputs.needs_pods == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.expand.outputs.pods) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - name: launch pod
        id: pod
        run: .venv/bin/pie-evals launch-pod --platform "${{ join(matrix.fallback, ',') }}" --labels "${{ join(matrix.labels, ',') }}" --repo "${{ github.repository }}" --image "${{ vars.RUNPOD_IMAGE || 'pieproject/runpod-ci-runner:latest' }}" --kill-minutes "${{ matrix.kill_minutes }}" --wait-runner 480
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      - name: launched marker
        run: |
          mkdir -p launched
          printf '{"pod": "%s", "platform": "%s", "labels": "%s"}' '${{ matrix.pod }}' '${{ steps.pod.outputs.platform }}' '${{ steps.pod.outputs.labels }}' > "launched/${{ matrix.pod }}.json"
          echo "${{ steps.pod.outputs.pod_id }}" > "launched/pod-${{ matrix.pod }}.txt"
      - uses: actions/upload-artifact@v4
        with: { name: "launched-${{ matrix.pod }}", path: launched/ }

  # shards whose pod is up (or that need none: resident runners) go to bench
  gate:
    needs: [expand, launch]
    if: always() && needs.expand.result == 'success' && fromJson(needs.expand.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "launched-*", path: launched, merge-multiple: true }
      - id: gate
        env: { MATRIX: "${{ needs.expand.outputs.matrix }}" }
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob, os
          # a fallback pod (the x1 when the x2 had no stock) carries fewer labels than planned
          up = [set(json.load(open(f))["labels"].split(",")) for f in glob.glob("launched/*.json")]
          shards = [e for e in json.loads(os.environ["MATRIX"])["include"] if not e["runpod"] or any(set(e["labels"]) <= labels for labels in up)]
          print("matrix=" + json.dumps({"include": shards}))
          print("count=" + str(len(shards)))
          PY
          echo "pods up: $(ls launched 2>/dev/null | tr '\n' ' ')"

  bench:
    needs: [expand, gate]
    if: always() && needs.gate.result == 'success' && fromJson(needs.gate.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    # hard kill = job budget × kill_factor (policy in matrix/suites.yaml): the runner watchdog and the pod
    # self-destruct fire at kill_minutes; the job outlives them by a margin so the records get uploaded
    # (nightly 35959142812: a flat 90 fired before the 120-minute watchdog and four shards left nothing)
    timeout-minutes: ${{ fromJSON(needs.expand.outputs.bench_timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: jobs, path: jobs }
      - name: install harness
        run: |
          # uv venvs carry no pip: install through uv when it exists, plain venv+pip otherwise (Macs)
          if command -v uv >/dev/null; then uv venv --quiet .venv && uv pip install --quiet --python .venv/bin/python -e "."
          else python3 -m venv .venv && .venv/bin/pip install -q -e "."; fi
      - name: pie root
        run: |
          # RunPod: the startup script sets PIE_ROOT=/tmp/pie (pod-local) and PIE_MIRROR (bare mirror on the volume);
          # the node clones from the mirror and restores the cached build. Macs: a resident checkout under $HOME.
          echo "PIE_ROOT=${PIE_ROOT:-$HOME/pie}" >> "$GITHUB_ENV"
      - name: run
        run: .venv/bin/pie-evals-node run --job "jobs/${{ matrix.job_id }}.json" --pie-root "$PIE_ROOT" --out "out/${{ matrix.job_id }}" --download
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }  # a pod without the volume fetches checkpoints itself; anonymous pulls hit 429
        # on RunPod every cache path comes from the runner's .env (written by the startup script)
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.job_id }}", path: "out/${{ matrix.job_id }}", retention-days: 30 }

  teardown:
    needs: [expand, launch, gate, bench]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "launched-*", path: launched, merge-multiple: true }
      - name: terminate pods
        run: for f in launched/pod-*.txt; do [ -f "$f" ] && .venv/bin/pie-evals terminate-pod "$(cat "$f")" || true; done
        env: { RUNPOD_API_KEY: "${{ secrets.RUNPOD_API_KEY }}" }

  # Bookkeeping. Inline rather than a nested `uses:` of collect.yml: the nested
  # form failed at startup because this job's `permissions` exceeded what the
  # caller granted (callers now grant contents: write); kept inline anyway.
  collect:
    needs: [expand, bench]
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: out }
      - name: import into store
        run: |
          shopt -s nullglob
          dirs=(out/out-*)
          if [ ${#dirs[@]} -gt 0 ]; then .venv/bin/pie-evals collect --tier "${{ inputs.tier }}" "${dirs[@]}"; else echo "::warning::no node outputs"; fi
      - name: reports
        id: report
        run: .venv/bin/pie-evals report --tier "${{ inputs.tier }}" --out reports
      - name: commit store + reports
        if: inputs.persist
        run: |
          git config user.name "pie-evals-bot"; git config user.email "pie-evals-bot@users.noreply.github.com"
          mkdir -p store/records reports
          git add -A -- store reports
          git diff --cached --quiet || git commit -m "store: ${{ inputs.tier }} run ${{ github.run_id }}"
          git pull --rebase --quiet origin main && git push --quiet origin HEAD:main
      - name: fail on regression
        if: inputs.persist && steps.report.outputs.regressions != '0'
        run: echo "::error::${{ steps.report.outputs.regressions }} confirmed regressions — see reports/${{ inputs.tier }}/regressions.md"; exit 1
