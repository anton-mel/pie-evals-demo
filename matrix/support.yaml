# Explicit support declarations. Anything matched here becomes a
# `declared_unsupported` cell: it is kept in the matrix and shown in the
# coverage report, but not run. Anything NOT matched here that then fails
# is a `fail` — which is the point: the wiki's "real LLMs at tp>1 are blocked
# by register_program" is a fail, not an unsupported.
#
# Selector fields: engine, backend, os, arch, platform, family, scheme,
# source_format, artifact_kind, program, program_category, workload, tp
# (int or ">1"/">=4"), spec_dec. All listed fields must match.
unsupported:
  - when: {backend: metal, tp: ">1"}
    reason: "no tensor parallel on Metal"
  - when: {backend: vulkan, tp: ">1"}
    reason: "no tensor parallel on Vulkan"
  - when: {backend: wgpu, tp: ">1"}
    reason: "no tensor parallel on wgpu"
  # engine-cuda has no selected reader in pool.cuh, so every dsv4 flash row (and the V4.1 rows)
  # is on its CANNOT_SERVE list for attention.pool_lse_selected; Metal, Vulkan and wgpu cover it
  - when: {family: deepseek_v4, engine: pie, backend: cuda}
    reason: "engine-cuda refuses attention.pool_lse_selected (dsv4 flash rows are CANNOT_SERVE on CUDA; Metal/Vulkan/wgpu only)"
  - when: {family: deepseek_v41, engine: pie, backend: cuda}
    reason: "engine-cuda refuses attention.pool_lse_selected (dsv41 rows are CANNOT_SERVE on CUDA; Metal/Vulkan/wgpu only)"
  - when: {family: deepseek_v41, engine: vllm}
    reason: "vLLM 0.30.0 has no deepseek_v41 (CSA2/Engram) model; revisit at the next pin"
  - when: {family: deepseek_v41, engine: sglang}
    reason: "SGLang 0.5.20 has no deepseek_v41 (CSA2/Engram) model; revisit at the next pin"
  # pie refuses the attention-only KV-policy inferlets on hybrid (recurrent-state) models:
  # nightly 35935510089, Qwen3.5-0.8B and the Qwen3.6-35B-A3B mini on the 4090
  - when: {program_category: kv_policy, family: qwen3_5}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_5 forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen3_6}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_6 forward pass is hybrid"
  - when: {program_category: kv_policy, family: qwen3_6_moe}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the qwen3_6_moe forward pass is hybrid"
  - when: {program_category: kv_policy, family: glm5_next}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the glm5_next forward pass is hybrid"
  - when: {program_category: kv_policy, family: kimi_k3}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the kimi_k3 forward pass is hybrid"
  - when: {program_category: kv_policy, family: nemotron_h}
    reason: "attention-only KV policies are not valid on a folded recurrent state (pie: use pie:inferlet/forward-hybrid); the nemotron_h forward pass is hybrid"
  # SGLang 0.5.20 cannot run gemma-4: every cell dies in its own code with
  # "view size is not compatible with input tensor's size and stride" / "shape '[-1, 1024]' is invalid" (L40S, 4090, 5090, A100 x2)
  - when: {engine: sglang, family: gemma4}
    reason: "SGLang 0.5.20 gemma-4 crashes in its attention/view path on every card tried; revisit at the next pin"
  - when: {engine: pie, backend: cuda, spec_dec: dflash2}
    reason: "CUDA engine exposes no draft head (Metal only) — wiki speculative-decoding/"
  - when: {scheme: fp8, arch: apple7}
    reason: "no fp8 path on Apple7"
  - when: {scheme: fp8, arch: apple8}
    reason: "no fp8 path on Apple8"
  - when: {scheme: fp8, arch: apple9}
    reason: "no fp8 path on Apple9"
  - when: {artifact: glm-5.3-flash-mini8, engine: vllm}
    reason: "vLLM does not load MLX affine checkpoints; the mini exists only in the mlx layout pie reads"
  - when: {artifact: glm-5.3-flash-mini8, engine: sglang}
    reason: "SGLang does not load MLX affine checkpoints"
  - when: {scheme: mlx_2bit, engine: vllm}
    reason: "vLLM does not load MLX quantized checkpoints"
  - when: {scheme: mlx_2bit, engine: sglang}
    reason: "SGLang does not load MLX quantized checkpoints"
  - when: {engine: llamacpp, os: linux}
    reason: "runner image has no nvcc; no CUDA llama.cpp build on pods yet"
  - when: {engine: llamacpp, tp: ">1"}
    reason: "llama.cpp layer-split is not tensor parallel; compared at tp1 only"
  - when: {engine: mlxlm, tp: ">1"}
    reason: "mlx-lm is single device"
  - when: {program_category: diffusion, engine: vllm}
    reason: "not an LLM serving workload"
  - when: {program_category: diffusion, engine: sglang}
    reason: "not an LLM serving workload"
  - when: {program_category: diffusion, engine: llamacpp}
    reason: "not an LLM serving workload"
  - when: {program_category: diffusion, engine: mlxlm}
    reason: "not an LLM serving workload"
  # no reader in pie 1a3b2e2a for these architectures (models crate: qwen_3 reads the
  # Qwen3.5/3.6/3.8 hybrids; no llama family) — a catalog Row alone would not load them
  - when: {artifact: llama-3.2-1b-bf16}
    reason: "pie has no llama family reader"
  # measured on pie 1a3b2e2a (smoke run 35820128533)
  - when: {program: prefill-rows}
    reason: "prefill-rows takes its own input (`ids`); pie_bench.py cannot drive it"
  # these inferlets answer with a different envelope than text-completion-bench
  # (non-JSON, or no num_output_tokens), so pie_bench.py cannot read their result;
  # they need a driver of their own before they can be cells
  - when: {program: prefix-tree-kv-cache, engine: pie}
    reason: "returns non-JSON to pie_bench.py (JSONDecodeError); on hybrid models also needs forward-hybrid"
  - when: {program: mtp-speculative-decoding, engine: pie}
    reason: "return envelope lacks num_output_tokens (pie_bench.py KeyError); on hybrid models also needs forward-hybrid"
  - when: {program: lora-probe, engine: pie}
    reason: "seeds a fixed-size adapter bank (1572864 bytes) that must match the model's layer count; needs a per-model input contract"
  - when: {program: cacheback-speculative-decoding, engine: pie}
    reason: "return envelope lacks num_output_tokens (pie_bench.py KeyError)"
  - when: {artifact: nemotron-h-mini8}
    reason: "shrink_checkpoint.py has no nemotron_h reader (supported: deepseek_v4, deepseek_v41, glm_moe_dsa, gpt_oss, kimi, muse_glimmer, qwen3_5_moe, qwen4_exp)"
  - when: {artifact: mini-dit}
    reason: "pie/mini-dit is not an HF repo; needs a checkpoint source"
  - when: {family: mini_dit, program_category: serving}
    reason: "diffusion model; no text serving path"
  - when: {family: mini_dit, program_category: speculative}
    reason: "diffusion model"
  - when: {family: mini_dit, program_category: kv_policy}
    reason: "diffusion model"
  - when: {family: mini_dit, program_category: adapter}
    reason: "diffusion model"

# Fit rule: artifact.expected_gib * fit_factor must be <= platform.memory_gib
# (per TP group). Cells that do not fit are declared_unsupported with reason
# "does not fit", never silently dropped.
fit_factor: 1.25
