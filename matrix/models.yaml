# Model artifacts. One base model appears once per (scheme, source_format,
# kind). `family` selects the pie model text and the miniature layer-pattern
# rule; `expected_gib` is the LM-only resident weight size used for the fit
# check and pod selection. Miniatures carry a recipe (see
# pie_evals.node.miniature) and can never pass an accuracy gate.
#
# TODO(user): confirm base_model repo ids for the newer families (Qwen3.5/3.6,
# gemma-4, DSV4, GLM-5); the ids below follow the names used in the pie wiki.
artifacts:
  # ---------------- smoke tier: small real models, one per family ----------
  - id: llama-3.2-1b-bf16
    base_model: meta-llama/Llama-3.2-1B-Instruct
    family: llama
    scheme: bf16
    expected_gib: 2.5
    tiers: [smoke, nightly, weekly]
  - id: qwen3.5-0.8b-bf16
    base_model: Qwen/Qwen3.5-0.8B
    family: qwen3_5      # GDN hybrid
    scheme: bf16
    max_context: 4096    # pie's qwen35-d0.8b SKU: "past the model's max_context of 4096 tokens" (HF config says 262144)
    expected_gib: 1.6
    tiers: [smoke, nightly, weekly]
  - id: gemma-4-e4b-bf16
    base_model: google/gemma-4-E4B-it
    family: gemma4
    scheme: bf16
    max_context: 4096    # pie's gemma4-e4b SKU: "past the model's max_context of 4096 tokens"
    expected_gib: 8.0
    tiers: [smoke, nightly, weekly]

  # ---------------- miniatures: real shapes of big architectures, cheap ----
  - id: qwen3.6-35b-a3b-mini5
    base_model: mlx-community/Qwen3.6-35B-A3B-4bit
    family: qwen3_6_moe   # hybrid MoE, 256 experts top-4
    scheme: affine_u4_g64
    source_format: mlx
    kind: miniature
    # pie's own fixture: matches catalog row qwen36-35b-a3b-mini-u4g64-kv-bf16 (layers: 5)
    miniature: {layers: "0-4", experts: 16, period: 4, note: "pie's mini-l5-e16 fixture"}
    max_context: 4096    # pie's SKU max_context ("past the model's max_context of 4096 tokens")
    expected_gib: 1.0
    tiers: [smoke, nightly, weekly]
  - id: gpt-oss-20b-mxfp4-mini5
    base_model: openai/gpt-oss-20b
    family: gpt_oss
    scheme: mxfp4
    kind: miniature
    # matches catalog row gptoss-20b-mini-bf16-mxfp4-kv-bf16 (layers: 5; pie PR pie-evals/gptoss-mini-sku)
    miniature: {layers: "0-4", experts: 16, period: 2, note: "sliding/full pairs; 16 of 32 experts"}
    max_context: 4096    # pie's SKU max_context ("past the model's max_context of 4096 tokens")
    expected_gib: 2.5
    tiers: [smoke, nightly, weekly]
  - id: deepseek-v4-flash-mini5
    base_model: mlx-community/DeepSeek-V4-Flash-bf16
    family: deepseek_v4   # CSA/HCA sparse attention + mHC + MoE
    scheme: bf16
    source_format: mlx    # mlx_lm layout (model.layers., stacked switch_mlp); pie reads it directly
    kind: miniature
    # matches catalog row dsv4-flash-mini-bf16-kv-bf16 (pie PR #625): source layers 0-3 (two SWA,
    # ratio-4 CSA with indexer, ratio-128 HCA) + 42 (the bias-gated closer), 16 of 256 experts
    miniature: {layers: "0-3,42", experts: 16, period: 1, note: "pie's flash_mini fixture; shrink family deepseek_v4_mlx"}
    max_context: 4096    # pie's SKU max_context ("past the model's max_context of 4096 tokens")
    expected_gib: 6.0
    tiers: [smoke, nightly, weekly]
  - id: deepseek-v4.1-flash-mini8
    base_model: deepseek-ai/DeepSeek-V4.1-Flash
    family: deepseek_v41  # CSA2 (cross-layer KV/index reuse) + single-pass mHC + Engram
    scheme: mxfp4         # fp8 dense planes read out to bf16 by the shrink; MXFP4 experts as released
    kind: miniature
    # matches catalog row dsv41-flash-mini-bf16-mxfp4-kv-bf16 (pie PR #627): every CSA2 mode once
    # (SWA, SWA+Engram, Full@2, Reuse@2, decoder Full@1, Reuse, Reindex, Reuse), 16 of 384 experts,
    # Engram tables re-carved to a 20 000 bucket base (482k rows of 384M)
    miniature: {layers: "0-3,20,21,24,25", experts: 16, period: 1, engram_vocab: 20000, note: "pie's flash41_mini fixture; 6.24 GiB download"}
    max_context: 4096
    expected_gib: 7.0
    tiers: [smoke, nightly, weekly]
  - id: glm-5.3-flash-mini8
    base_model: Vontra/GLM-5.3-Flash-MLX-4bit-MTP
    family: glm5_next     # KDA linear attention + DSA sparse attention every 4th layer, mHC, MoE
    scheme: affine_u4_g64
    source_format: mlx
    kind: miniature
    # matches catalog row glm53-flash-mini-u4g64-u4g64-kv-bf16 (pie branch pie-evals/dsv41-flash):
    # three dense KDA layers, DSA+MoE, three KDA+MoE, DSA; 32 of 288 experts (top-8 kept); MTP head dropped
    miniature: {layers: "0-7", experts: 32, period: 4, note: "shrink family glm5_next_mlx; 4.71 GiB download"}
    max_context: 4096
    expected_gib: 5.0
    tiers: [smoke, nightly, weekly]
  - id: kimi-k3-mini8
    base_model: moonshotai/Kimi-K3
    family: kimi_k3       # KDA + MLA (every 4th), latent MoE, AttnRes
    scheme: mxfp4         # experts as released (compressed-tensors MXFP4); dense planes bf16
    kind: miniature
    # matches catalog row kimik3-mini-bf16-mxfp4-kv-bf16 (pie branch pie-evals/dsv41-flash):
    # dense layer 0 + KDA/KDA/KDA/MLA twice, 32 of 896 experts (top-16 kept), AttnRes blocks of 4
    miniature: {layers: "0-7", experts: 32, period: 4, attn_res_block_size: 4, note: "shrink family kimi_k3; 18.4 GiB download"}
    max_context: 4096
    expected_gib: 19.0
    tiers: [smoke, nightly, weekly]
  - id: nemotron-h-mini8
    base_model: nvidia/Nemotron-H-8B-Base-8K
    family: nemotron_h    # Mamba/SSM hybrid
    scheme: bf16
    kind: miniature
    miniature: {layers: "0-11", period: 6, note: "two M-M-M-A-M-F periods"}
    expected_gib: 3.0
    tiers: [smoke, nightly, weekly]
  - id: mini-dit
    base_model: pie/mini-dit
    family: mini_dit
    scheme: bf16
    expected_gib: 0.5
    tiers: [smoke, nightly, weekly]

  # ---------------- nightly: full mid-size, several schemes (dense qwen3 has no reader in pie and is not planned) ----------------
  - id: gpt-oss-20b-mxfp4
    base_model: openai/gpt-oss-20b
    family: gpt_oss
    scheme: mxfp4
    max_context: 4096    # pie's SKU max_context ("past the model's max_context of 4096 tokens")
    expected_gib: 10.4
    tiers: [nightly, weekly]

  # ---------------- macOS five (mlx-community 4-bit) + GGUF arms -----------
  - id: qwen3.6-27b-mlx4
