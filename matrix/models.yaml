  - id: qwen3.6-27b-gguf-q4km
    base_model: unsloth/Qwen3.6-27B-GGUF
    family: qwen3_6
    scheme: gguf_q4_k_m
    source_format: gguf
    gguf_file: Qwen3.6-27B-Q4_K_M.gguf
    gguf_config_from: Qwen/Qwen3.6-27B
    expected_gib: 15.6
    tiers: [nightly, weekly]

  # ---------------- weekly: big ------------------------------------------
  - id: gpt-oss-120b-mxfp4
    base_model: openai/gpt-oss-120b
    family: gpt_oss
    scheme: mxfp4
    expected_gib: 61.0
    tiers: [weekly]
  - id: deepseek-v4-flash-mlx2
    base_model: deepseek-ai/DeepSeek-V4-Flash
    family: deepseek_v4
    scheme: mlx_2bit
    source_format: mlx
    expected_gib: 89.9
    tiers: [weekly]
  - id: qwen3.6-27b-bf16
    base_model: Qwen/Qwen3.6-27B
