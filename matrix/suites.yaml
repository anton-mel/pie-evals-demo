# Tier composition. The base rule is the intersection of `tiers` across every
# component of a cell (engine, platform, artifact, workload, program, mode).
# `exclude` removes cells from a tier; `include` forces cells in. Selectors
# use the same fields as support.yaml.
#
# Time policy (applies to every tier):
#   * every job is sharded to ~`job_budget_minutes` of estimated work; one
#     job = one pod (or one Mac slot). A process group (one loaded model) is
#     never split across shards.
#   * a job that runs past budget × `kill_factor` is force-killed at three
#     levels: the node runner's watchdog, the workflow's timeout-minutes, and
#     the pod's own self-destruct timer. Cells it never reached are recorded
#     as not_run with the reason, never dropped.
#   * `max_jobs_per_platform` caps how many pods a tier may fan out to.
job_budget_minutes: 60
kill_factor: 1.5

# Removed from EVERY tier (not unsupported — just never scheduled here):
global_exclude:
  # a multi-GPU platform exists for tp>1; its tp1 cells are the single-GPU platform's job
  - {platform: l40s-x2, tp: 1}
  - {platform: pro6000-x4, tp: 1}
  - {platform: h100-sxm-x4, tp: 1}
  - {platform: a100-x2, tp: 1}
  # a 4-GPU platform exists for tp4 (tp2 is the 2-GPU platform's job)
  - {platform: pro6000-x4, tp: 2}
  - {platform: h100-sxm-x4, tp: 2}

suites:
  smoke:
    # smoke must fit ONE job per platform (a commit gets one pod per GPU type).
    # est_minutes are provisional until calibrated (reports/calibration.md).
    max_jobs_per_platform: 2
    enforce_budget: true
    exclude:
      # every non-serving program runs on exactly one representative shape in smoke;
      # the full shape list is nightly's job
      - {program_category: speculative, not_workload: [ss-128-64]}
      - {program_category: adapter, not_workload: [ss-128-64]}
      - {program_category: kv_policy, not_workload: [lc-2k-128]}
      - {program: prefill-rows, not_workload: [lc-2k-128]}
      - {program: prefix-tree-kv-cache, not_workload: [prefix-1k-x64]}
      # 8k context and the length mix only on the two cheapest dense models in smoke
      - {workload: lc-8k-128, not_artifact: [qwen3.5-0.8b-bf16, gemma-4-e4b-bf16]}
      - {workload: mixed-256, not_artifact: [qwen3.5-0.8b-bf16, qwen3.6-35b-a3b-mini5]}
      - {workload: c32, not_artifact: [qwen3.5-0.8b-bf16, gemma-4-e4b-bf16, qwen3.6-35b-a3b-mini5]}
      # TP smoke is about sharding, not policies or long shapes
      - {tp: ">=2", program_category: kv_policy}
      - {tp: ">=2", program_category: adapter}
      - {tp: ">=2", program_category: speculative}
      - {tp: ">=2", not_workload: [control-aa, ss-128-64, c8, lc-2k-128]}
      - {tp: ">=2", not_artifact: [qwen3.5-0.8b-bf16, qwen3.6-35b-a3b-mini5, gpt-oss-20b-mxfp4-mini5, deepseek-v4-flash-mini5]}
    # smoke never runs baselines (engines.yaml already says so); it compares pie with pie history.
  nightly:
    max_jobs_per_platform: 48
    enforce_budget: true
    exclude:
      - {engine: vllm, workload: control-aa}
      - {engine: sglang, workload: control-aa}
      - {engine: llamacpp, workload: control-aa}
      - {engine: mlxlm, workload: control-aa}
  weekly:
    max_jobs_per_platform: 120
    enforce_budget: true
    exclude: []

# Escalation: when a smoke cell of a family is flagged (regression confirmed),
# every nightly cell of that family on the same platform is promoted into the
# next nightly run even if it would not be scheduled that night.
escalation:
  on_smoke_regression_promote_family_to_nightly: true
