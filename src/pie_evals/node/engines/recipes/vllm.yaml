# vLLM recipes. Knob -> flag mapping lives in VllmEngine.engine_args; every
# knob here maps onto a flag scripts/bench/vllm_bench.py or scripts/bench/common.py
# parses. Knobs vllm_bench.py derives itself (max_num_seqs = --concurrency)
# are listed for the record with `flag: none`.

default:
  knobs:
    gpu_mem_util:
      value: 0.90
      rationale: Same fraction pie and SGLang are given (see pie.yaml).
    report_timing:
      value: true
      rationale: >
        Switches tput mode to the AsyncLLM streaming client so TTFT and
        inter-token gaps are stamped on token delivery, the vantage pie's
        client has. Without it vLLM's tput run reports no per-request timing.
    prefix_caching:
      value: false
      rationale: >
        Off by default: a closed-loop client reusing a prompt would otherwise
        measure the cache, and pie runs without one on these shapes.

competitive:
  extends: default
  knobs:
    attention_backend:
      value: FLASHINFER
      rationale: >
        vLLM's auto pick is not always its fastest kernel on a given part;
        FlashInfer is the backend the vLLM maintainers benchmark decode with
        on Ada/Blackwell. Named so the baseline is not hobbled by a heuristic.
    max_num_seqs:
      value: "$concurrency"
      flag: none
      rationale: >
        vllm_bench.py sets max_num_seqs from --concurrency itself (1 in
        latency mode), so engine admission equals the client's offered load on
        both engines. Recorded here so the recipe says what ran; nothing is
        emitted.
    chunked_prefill:
      value: true
      rationale: >
        vLLM's default; the script only has --no-chunked-prefill. Left on
        because that is what a deployment gets.
    max_num_batched_tokens:
      value: null
      rationale: >
        Unset leaves vLLM's own scheduler budget (8192 on V1). Set per arch
        if a shape shows prefill starving decode.
  family:
    gpt_oss:
      knobs:
        attention_backend:
          value: null
          rationale: >
            gpt-oss attends with sinks, and vLLM 0.30's FlashInfer backend
            refuses them off Hopper ("attention sinks not supported": every
            gpt-oss cell of nightly 35908055874 on the 4090). Unset leaves
            vLLM's own pick (TRITON_ATTN there); the Hopper override below
            still names FA3, which carries sinks.
  arch:
    hopper:
      knobs:
        attention_backend:
          value: FLASH_ATTN
          rationale: FA3 is vLLM's fastest Hopper path; FlashInfer trails it there.
    apple9:
      knobs: {}
  workload_kind:
    prefix_shared:
      knobs:
        prefix_caching:
          value: true
          rationale: >
            The shared-prefix shape exists to exercise prefix reuse; pie's
            prefix tree is on for it, so vLLM gets its cache too.
    mixed_length:
      knobs:
        prefix_caching:
          value: false
          rationale: common.py's --mixed-phase help asks for prefix caching OFF on both engines.
