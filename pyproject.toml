[project]
name = "pie-evals"
version = "0.1.0"
description = "Benchmark & evaluation framework for pie: performance vs other engines, accuracy preservation, coverage and regression tracking."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "click>=8.1",
]

[project.optional-dependencies]
accuracy = ["torch", "transformers>=4.44", "safetensors", "datasets"]
orchestrate = ["requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pie-evals-node = "pie_evals.node.cli:main"
pie-evals = "pie_evals.orchestrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pie_evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP017", "B008", "B905"]
